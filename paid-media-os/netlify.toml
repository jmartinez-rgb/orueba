# ABCW Paid Media OS · paquete ya compilado para publicar con la CLI de Netlify (sin GitHub).
[build]
  command = ""
  publish = "sitio"
  functions = "functions"

# SPA: cualquier ruta que no sea /api ni /plan sirve la app.
[[redirects]]
  from = "/plan/*"
  to = "/plan/index.html"
  status = 200
  force = false

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Content-Security-Policy = "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://*.fbcdn.net https://*.cdninstagram.com https://*.googleusercontent.com; frame-src https://www.facebook.com https://business.facebook.com; media-src 'self' blob: https://*.fbcdn.net; connect-src 'self'; form-action 'self' https://accounts.google.com https://www.facebook.com; frame-ancestors 'none'; base-uri 'none'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
