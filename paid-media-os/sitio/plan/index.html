<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Plan masivo · ABCW Paid Media OS</title>
<meta name="description" content="Captura de campañas de Meta para carga masiva.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%230A0A0A'/><rect x='7' y='7' width='18' height='4' fill='%2300A9E0'/><rect x='7' y='14' width='18' height='4' fill='%2300A9E0'/><rect x='7' y='21' width='11' height='4' fill='%2300A9E0'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css?v=5.7.0">
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand"><span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/><path d="M3 17.5l9 5 9-5" opacity=".55"/></svg></span><b>Plan masivo</b><span id="modeTag">ABCW</span></div>
    <nav class="steps" id="steps" aria-label="Pasos"></nav>
    <div class="tools">
      <button type="button" id="btnAlertas" class="tool-alertas" title="Alertas del plan"><span class="ico-slot" data-ico="alerta"></span><span class="t">Alertas</span><b id="nAlertas" class="badge hide">0</b></button>
      <button type="button" id="btnChequeo" title="Chequeo de la configuración de Meta"><span class="ico-slot" data-ico="escudo"></span><span class="t">Chequeo de Meta</span></button>
      <button type="button" id="btnLeads" title="Formularios instantáneos y descarga de leads"><span class="ico-slot" data-ico="form"></span><span class="t">Formularios y leads</span></button>
      <button type="button" id="btnHistorial" title="Historial de publicaciones"><span class="ico-slot" data-ico="reloj"></span><span class="t">Historial</span></button>
      <button type="button" id="btnHoja" title="Abrir la hoja de cálculo (bitácora)"><span class="ico-slot" data-ico="hoja"></span><span class="t">Hoja</span></button>
      <button type="button" id="btnGuardar" title="Guardar lo capturado como archivo"><span class="ico-slot" data-ico="guardar"></span><span class="t">Guardar</span></button>
      <button type="button" id="btnCargar" title="Retomar un borrador guardado"><span class="ico-slot" data-ico="abrir"></span><span class="t">Abrir</span></button>
      <input type="file" id="fileBorrador" accept="application/json" class="hide">
    </div>
    <div class="tally">
      <div><b id="tAdsets">0</b><small>conjuntos</small></div>
      <div><b id="tAds">0</b><small>anuncios</small></div>
    </div>
    <div class="avance" aria-hidden="true"><i id="avance"></i></div>
  </header>

  <div class="layout">
    <main id="view">
      <div class="boot">
        <h1>Cargando</h1>
        <p class="lede"><span class="spinner"></span> Leyendo las cuentas disponibles.</p>
      </div>
    </main>
    <aside class="resumen" id="resumen" aria-label="Resumen del plan"></aside>
  </div>

  <div class="dock">
    <div class="in">
      <button class="btn ghost" id="back">Atrás</button>
      <div class="msg" id="msg"></div>
      <button class="btn go" id="next">Continuar</button>
    </div>
  </div>
</div>

<script src="guard.js?v=5.7.0"></script>
<script src="config.js?v=5.7.0"></script>
<script src="assets/model.js?v=5.7.0"></script>
<script src="assets/ui.js?v=5.7.0"></script>
<script src="assets/gestor.js?v=5.7.0"></script>
<script src="assets/app.js?v=5.7.0"></script>
</body>
</html>
